# Cloud Build: build the TSA FastAPI + SQLite image and deploy to Cloud Run.
# Trigger: push to the sqlite branch. The image includes data/tsa.db baked in.
# The frontend (Cloudflare Pages) is deployed separately from the same repo.
# Region: us-east1 (closest to New York). Service: tsa-api.
# Required APIs: Cloud Build, Artifact Registry, Cloud Run.
# The Gemini API key is set as an environment variable on the Cloud Run
# service by the user in the GCP console (it is never in this repo).
#
# NOTE: data/tsa.db (~172 MB) is git-ignored (over GitHub's 100 MB file
# limit), so it is shipped as a GitHub Release asset (tag data-v1) and
# downloaded by the first build step below. To refresh the data, upload a
# new data/tsa.db to the data-v1 release (or a new tag) and update the URL.

steps:
  # Download the SQLite database from the GitHub Release asset.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'mkdir -p data && curl -L -o data/tsa.db https://github.com/yinou23/tennis-scout-agent/releases/download/data-v1/tsa.db && ls -lh data/tsa.db'
  # Build the Docker image (Dockerfile at repo root).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/tsa/tsa-api:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/tsa/tsa-api:latest'
      - '.'
  # Push the image to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/tsa/tsa-api:$COMMIT_SHA'
  # Deploy to Cloud Run (service tsa-api, public, port 8000).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'tsa-api'
      - '--image'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/tsa/tsa-api:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'

options:
  logging: CLOUD_LOGGING_ONLY
